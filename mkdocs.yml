site_name: RPP
site_description: "Rover Photogrammetry Pipeline: Mars rover PDS images to true-scale, multi-station 3D"
site_author: Christian Tate
site_url: https://ctate7163.github.io/rpp/
repo_url: https://github.com/ctate7163/rpp
repo_name: ctate7163/rpp
edit_uri: ""
copyright: "Copyright 2026 Christian Tate, Malin Space Science Systems. Apache-2.0."
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Quick start: quickstart.md
      - What is validated: status.md
  - Pipeline:
      - The steps: pipeline.md
      - Camera models and calibration: calibration.md
      - Rover masks: masks.md
      - Downstream exports: exports.md
  - Stations and viewer:
      - RPV, the viewer: viewer.md
      - Station products: station-products.md
      - Rover model: rover-model.md
  - Reference:
      - Command line: cli.md
      - API reference: api.md
      - Methods: methods.md
      - Windows batch files: WINDOWS.md
  - Project:
      - Roadmap: roadmap.md
      - Contributing: contributing.md
      - Citing: citing.md

# The changelogs before 1.0 (docs/history/) and the Hugging Face card; not part of the site.
exclude_docs: |
  hf_model_card.md
  history/

# Built and linkable, but not in the navigation.
not_in_nav: |
  RELEASING.md
  CODE_OF_CONDUCT.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]
            show_if_no_docstring: false
            merge_init_into_class: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
