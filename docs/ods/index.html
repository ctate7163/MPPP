<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MPPP stereo panoramas</title>
<!--
  MPPP stereo 360 viewer (prototype, 0.97.3; 0.97.18: the eye shown on a screen can be chosen).  One static page: three.js (vendor/, r170, MIT) and panos.json.
  Images: <name>_360_3DTD.jpg from `mppp ods` - square, the left eye on top of the right, each an equirectangular
  panorama whose left edge looks north with azimuth growing eastward.
  Link to one view:   .../ods/#<station>/<variant>/<view>      e.g.  #Sol0052_S003D2046/rover/enhanced
  Another image list: .../ods/?index=https://<same origin or CORS-enabled host>/panos.json
  Keys: left / right arrows = station, V = variant, E = view, I = info, L = the other eye (on a screen), drag = look, wheel = zoom.
  Headset (0.98.4): right trigger = next station, left trigger = the one before, thumbstick left / right = turn,
  X = info page on the left hand (site, sol, map), A = the next view (standard, normal, range log), grip = variant   (0.98.13: A and X swapped)
  (terrain only, terrain with rover (projected), terrain with rover (3D model)).
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; left: 0; right: 0; top: 0; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
         background: linear-gradient(#000c, #0000); z-index: 2; }
  #bar select, #bar button { background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; font: inherit; }
  #title { font-weight: 600; margin-right: 6px; }
  #note { position: fixed; left: 10px; bottom: 10px; right: 170px; color: #bbb; font-size: 12px; z-index: 2; text-shadow: 0 0 4px #000; }
  #diag { position: fixed; right: 170px; bottom: 10px; color: #888; font-size: 11px; z-index: 2; text-shadow: 0 0 4px #000; text-align: right; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 1;
         font-size: 16px; text-shadow: 0 0 6px #000; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="bar">
  <span id="title">MPPP stereo panoramas</span>
  <select id="station" title="station"></select>
  <select id="variant" title="variant"></select>
  <select id="view" title="view"></select>
  <select id="eye" title="which eye's panorama a screen shows (a headset shows both)">
    <option value="left">left eye</option><option value="right">right eye</option>
  </select>
  <button id="north" title="look north">N</button>
</div>
<div id="msg">loading the list ...</div>
<div id="note"></div>
<div id="diag" title="what this device can show"></div>
<script type="module">
import * as THREE from 'three';
import { VRButton } from './vendor/VRButton.js';

const $ = id => document.getElementById(id);
const msg = t => { $('msg').textContent = t || ''; };

// ---------------------------------------------------------------- scene: one sphere per eye, the viewer at its centre
const renderer = new THREE.WebGLRenderer({ antialias: true });   // 0.98.14: the rover model's edges (false until then)
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
// On a screen one eye's panorama is shown: the left (layer 1) or the right (layer 2), chosen in the bar (0.97.18).
// In a headset three.js gives its left camera layer 1 and its right camera layer 2 ON TOP OF this camera's layers,
// so this camera must carry neither while a session runs - else one eye would be given both panoramas.
let screenEye = 'left';
function setEye(e) {
  screenEye = e === 'right' ? 'right' : 'left';
  camera.layers.set(0);
  if (!renderer.xr.isPresenting) camera.layers.enable(screenEye === 'left' ? 1 : 2);
  const sel = document.getElementById('eye');
  if (sel) sel.value = screenEye;
}
setEye('left');
renderer.xr.addEventListener('sessionstart', () => { camera.layers.set(0); });
renderer.xr.addEventListener('sessionend', () => { setEye(screenEye); });
const world = new THREE.Group();               // turned about the vertical for the start heading
scene.add(world);

// The equirect grid as a sphere seen from inside: azimuth az from north (-z) towards east (+x), elevation el up (+y).
// u = az / 2 pi; the texture's upper half is the left eye (v 0.5-1 with three's flipped y), the lower half the right.
function eyeSphere(eye, texel) {
  const W = 128, H = 64, R = 50, pos = [], uv = [], idx = [];
  const v0 = eye === 'left' ? 0.5 : 0.0;
  for (let j = 0; j <= H; j++) {
    const el = Math.PI / 2 - j / H * Math.PI;
    for (let i = 0; i <= W; i++) {
      const az = i / W * 2 * Math.PI;
      pos.push(R * Math.cos(el) * Math.sin(az), R * Math.sin(el), -R * Math.cos(el) * Math.cos(az));
      const v = v0 + 0.5 * (1 - j / H);
      uv.push(i / W, Math.min(v0 + 0.5 - texel, Math.max(v0 + texel, v)));      // half a texel off the other eye's rows
    }
  }
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const a = j * (W + 1) + i, b = a + 1, c = a + W + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
const material = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide, depthTest: false, depthWrite: false });
const spheres = {};
for (const [eye, layer] of [['left', 1], ['right', 2]]) {      // three.js: the XR left camera sees layer 1, the right layer 2
  const m = new THREE.Mesh(eyeSphere(eye, 0.5 / 8192), material);
  m.layers.set(layer);
  m.frustumCulled = false;
  world.add(m);
  spheres[eye] = m;
}

// ---------------------------------------------------------------- the nadir mark as a surface on the ground (0.97.24)
// In the panorama the mark's two eyes come from an omnidirectional pair whose separation shrinks towards the nadir, so
// straight down it sits at no sensible distance and its text is hard to read.  Here it is a real disc: a little wider
// than the mark in the panorama (which it covers), lying depth_m below the eyes, drawn by both eye cameras of the
// headset from where they are - its disparity is that of a thing on the ground.  panos.json gives each variant's
// "ground_mark": {file, depth_m, radius_m}.  The picture is the mark from above, north up and east to the right:
// a circle in the x-y plane turned to lie flat has its +y at north (-z) and its +x at east, as the spheres do.
// M shows and hides it.
const markMaterial = new THREE.MeshBasicMaterial({ transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide });
// 0.98.4: the disc is two parts of the one picture.  The inner circle (the compass) stays fixed to north; the outer
// ring (the text) turns about the vertical so that its text is upright for the viewer, whichever way they face.
// It lies at ground level in both variants (panos.json gives the with-rover variant the terrain's depth).
const MARK_SPLIT = 0.53;                        // the compass ends at 0.50 of the radius, the text begins at 0.56
function discPart(g) {                          // texture coordinates of the whole picture: the unit disc in a square
  const p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + 1) / 2, (p.getY(i) + 1) / 2);
  const m = new THREE.Mesh(g, markMaterial);
  m.renderOrder = 2; m.frustumCulled = false;   // after the spheres
  return m;
}
const markDisc = new THREE.Group();             // x east, y north before it is laid flat
let markInner = null, markOuter = null, markSplit = 0;
function cutMark(split) {                       // 0.98.7: the cut follows the picture (ground_mark.split)
  if (split === markSplit) return;
  const turn = markOuter ? markOuter.rotation.z : 0;
  for (const m of [markInner, markOuter]) if (m) { markDisc.remove(m); m.geometry.dispose(); }
  markInner = discPart(new THREE.CircleGeometry(split, 96));
  markOuter = discPart(new THREE.RingGeometry(split, 1, 96, 1));
  markOuter.rotation.z = turn;
  markDisc.add(markInner, markOuter);
  markSplit = split;
}
cutMark(MARK_SPLIT);
markDisc.rotation.x = -Math.PI / 2;
markDisc.visible = false;
world.add(markDisc);
let markOn = true, markId = 0, markTextAz = 0;
async function showMark(gm) {
  const id = ++markId;
  markDisc.visible = false;
  if (!gm || !gm.file || !(gm.depth_m > 0) || !(gm.radius_m > 0)) return;
  try {
    const bmp = await createImageBitmap(await (await fetch(new URL(gm.file, base).href)).blob(), { imageOrientation: 'flipY' });
    if (id !== markId) { bmp.close(); return; }
    const t = new THREE.Texture(bmp);
    t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = true;
    t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    t.needsUpdate = true;
    if (markMaterial.map) { const o = markMaterial.map; markMaterial.map = null; o.dispose(); if (o.image && o.image.close) o.image.close(); }
    markMaterial.map = t; markMaterial.needsUpdate = true;
    cutMark(gm.split > 0.2 && gm.split < 0.9 ? gm.split : MARK_SPLIT);
    markDisc.scale.set(gm.radius_m, gm.radius_m, 1);
    markDisc.position.set(0, -gm.depth_m, 0);
    markTextAz = THREE.MathUtils.degToRad(gm.text_centre_azimuth_deg || 0);    // where the text's middle is in the picture
    markDisc.visible = markOn;
  } catch (e) { console.warn('ground mark', e); }
}

// ---------------------------------------------------------------- the rover as a 3D model (0.98.14)
// panos.json may give a variant a "rover_surface": {file}: a binary glTF written by mppp.ibr.rover_surface - the
// Perseverance model where it stands at this station, in metres about the eyes' pivot (x east, y up, z south: this
// page's frame), with two images: the panorama from the pivot (the rows that hold the rover) and its range.
// A point of the model takes the panorama's colour in its direction when it is the surface the pivot sees there
// (its distance against the range image, weighted over the four range pixels around it: a smooth border); what the
// pivot does not see - no camera saw it - is the rover grey, shaded a little by its slope.  The model is a real
// surface with all its sides, so it shifts against the terrain when the head moves and has no holes.  R shows and
// hides it.  It hangs in "fixed", a group that stays where the head was when it appeared (the spheres follow the head).
// (A file of 0.98.2-0.98.13 - a grid mesh with its own texture coordinates - is still shown, as it was.)
const fixed = new THREE.Group();
scene.add(fixed);
let roverParts = [], roverOn = true, roverId = 0, anchored = false;
renderer.xr.addEventListener('sessionstart', () => { anchored = false; });
const ROVER_VERT = `
  varying vec3 vP;
  void main() { vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const ROVER_FRAG = `
  precision highp float;
  varying vec3 vP;
  uniform sampler2D colourMap, rangeMap;
  uniform vec2 panoSize, rangeSize;      // the panorama (px); the range image (px)
  uniform vec2 rows;                     // the first panorama row of the images, and their number of rows
  uniform float az0, rangeStep, rangeOffset, unitsPerM, biasM, biasRel, greyShade;
  uniform vec3 grey;
  float seen(vec2 ij, float dist) {      // one range pixel: is the point the surface the pivot sees there?
    if (ij.y < 0.0 || ij.y > rangeSize.y - 1.0) return 0.0;
    vec4 t = texture2D(rangeMap, vec2(fract((ij.x + 0.5) / rangeSize.x), (ij.y + 0.5) / rangeSize.y));
    float z = (floor(t.r * 255.0 + 0.5) * 256.0 + floor(t.g * 255.0 + 0.5)) / unitsPerM;
    return (z > 0.0 && dist <= z * (1.0 + biasRel) + biasM) ? 1.0 : 0.0;
  }
  void main() {
    float dist = length(vP);
    vec3 d = vP / dist;
    float ua = (atan(d.x, -d.z) - az0) / 6.283185307179586;
    float u1 = fract(ua), u2 = fract(ua + 0.5) - 0.5;                 // two ways round: the one without the jump here
    float u = fwidth(u1) <= fwidth(u2) ? u1 : u2;
    float row = (0.5 - asin(clamp(d.y, -1.0, 1.0)) / 3.141592653589793) * panoSize.y;
    vec3 c = texture2D(colourMap, vec2(u, (row - rows.x) / rows.y)).rgb;
    vec2 q = vec2((fract(ua) * panoSize.x - 0.5 - rangeOffset) / rangeStep, (row - 0.5 - rows.x - rangeOffset) / rangeStep);
    vec2 i0 = floor(q), f = q - i0;
    float lit = mix(mix(seen(i0, dist), seen(i0 + vec2(1.0, 0.0), dist), f.x),
                    mix(seen(i0 + vec2(0.0, 1.0), dist), seen(i0 + vec2(1.0, 1.0), dist), f.x), f.y);
    vec3 n = normalize(cross(dFdx(vP), dFdy(vP)));
    vec3 g = grey * (1.0 - greyShade * (1.0 - abs(n.y)));
    gl_FragColor = vec4(mix(g, c, lit), 1.0);
  }`;
function dropRover() {
  for (const m of roverParts) {
    fixed.remove(m); m.geometry.dispose();
    for (const o of (m.userData.textures || [])) { o.dispose(); if (o.image && o.image.close) o.image.close(); }
    m.material.dispose();
  }
  roverParts = [];
}
async function showRover(rs) {
  const id = ++roverId;
  dropRover();
  if (!rs || !rs.file) return;
  try {
    const buf = await (await fetch(new URL(rs.file, base).href)).arrayBuffer();
    const dv = new DataView(buf);
    if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('not a .glb file');
    const n = dv.getUint32(12, true), doc = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, n)));
    const bin = 28 + n, view = i => doc.bufferViews[i];
    const arr = (acc, T, k) => { const a = doc.accessors[acc], v = view(a.bufferView); return new T(buf.slice(bin + (v.byteOffset || 0), bin + (v.byteOffset || 0) + a.count * k * T.BYTES_PER_ELEMENT)); };
    const image = async (i, opt) => { const iv = view(doc.images[i].bufferView); return createImageBitmap(new Blob([new Uint8Array(buf, bin + (iv.byteOffset || 0), iv.byteLength)], { type: doc.images[i].mimeType }), opt); };
    const pr = doc.asset && doc.asset.extras && doc.asset.extras.projection;
    const made = [];
    for (const prim of doc.meshes[0].primitives) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(arr(prim.attributes.POSITION, Float32Array, 3), 3));
      g.setIndex(new THREE.BufferAttribute(arr(prim.indices, Uint32Array, 1), 1));
      let mat, textures;
      if (pr) {                                                  // 0.98.14: the model, coloured from the pivot
        const col = new THREE.Texture(await image(0));
        col.flipY = false; col.colorSpace = THREE.NoColorSpace; col.wrapS = THREE.RepeatWrapping; col.generateMipmaps = true;
        col.minFilter = THREE.LinearMipmapLinearFilter; col.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        col.needsUpdate = true;
        const rng = new THREE.Texture(await image(1, { colorSpaceConversion: 'none', premultiplyAlpha: 'none' }));
        rng.flipY = false; rng.colorSpace = THREE.NoColorSpace; rng.wrapS = THREE.RepeatWrapping; rng.generateMipmaps = false;
        rng.minFilter = THREE.NearestFilter; rng.magFilter = THREE.NearestFilter; rng.needsUpdate = true;
        mat = new THREE.ShaderMaterial({ vertexShader: ROVER_VERT, fragmentShader: ROVER_FRAG, side: THREE.DoubleSide, uniforms: {
          colourMap: { value: col }, rangeMap: { value: rng },
          panoSize: { value: new THREE.Vector2(pr.width, pr.height) }, rangeSize: { value: new THREE.Vector2(pr.depth_px[0], pr.depth_px[1]) },
          rows: { value: new THREE.Vector2(pr.rows[0], pr.rows[1] - pr.rows[0]) }, az0: { value: THREE.MathUtils.degToRad(pr.azimuth0_deg || 0) },
          rangeStep: { value: pr.depth_step }, rangeOffset: { value: pr.depth_offset_px || 0 }, unitsPerM: { value: pr.depth_units_per_m },
          biasM: { value: pr.bias_m }, biasRel: { value: pr.bias_rel }, greyShade: { value: pr.grey_shade || 0 },
          grey: { value: new THREE.Vector3(pr.grey_rgb[0] / 255, pr.grey_rgb[1] / 255, pr.grey_rgb[2] / 255) } } });
        textures = [col, rng];
      } else {                                                   // a file of before 0.98.14
        g.setAttribute('uv', new THREE.BufferAttribute(arr(prim.attributes.TEXCOORD_0, Float32Array, 2), 2));
        const t = new THREE.Texture(await image(doc.textures[doc.materials[prim.material].pbrMetallicRoughness.baseColorTexture.index].source));
        t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; t.generateMipmaps = true;
        t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        t.needsUpdate = true;
        mat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, map: t });
        textures = [t];
      }
      const m = new THREE.Mesh(g, mat);
      m.userData.textures = textures;
      m.renderOrder = 1; m.frustumCulled = false; m.visible = roverOn;
      made.push(m);
    }
    if (id !== roverId) { for (const m of made) { m.geometry.dispose(); for (const o of m.userData.textures) o.dispose(); m.material.dispose(); } return; }
    roverParts = made;
    for (const m of made) fixed.add(m);
    anchored = false;
  } catch (e) { console.warn('rover surface', e); }
}

// ---------------------------------------------------------------- words in the scene (0.98.4)
// Text is drawn on a canvas and shown on a flat panel: a real surface at a real distance, so both eyes agree on it.
function textPanel(lines, opt = {}) {                            // lines: [{text, px, weight}] ; returns a Mesh 1 unit wide
  const pad = 40, W = opt.width || 2048, font = l => `${l.weight || 800} ${l.px}px system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const Hpx = pad * 2 + lines.reduce((a, l) => a + l.px * 1.25, 0);
  c.width = W; c.height = Math.ceil(Hpx);
  if (opt.back) { g.fillStyle = opt.back; g.beginPath(); g.roundRect(0, 0, c.width, c.height, 48); g.fill(); }
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  let y = pad;
  for (const l of lines) {
    g.font = font(l);
    let px = l.px;
    while (g.measureText(l.text).width > W - 2 * pad && px > 12) { px -= 4; g.font = font({ ...l, px }); }
    y += l.px * 0.625;
    g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = Math.max(4, px * 0.10); g.strokeText(l.text, W / 2, y);
    g.fillStyle = l.color || '#fff'; g.fillText(l.text, W / 2, y);
    y += l.px * 0.625;
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, c.height / c.width),
                           new THREE.MeshBasicMaterial({ map: t, transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide }));
  m.renderOrder = 4; m.frustumCulled = false;
  return m;
}
function place(m, azDeg, elDeg, dist, width) {                   // in the page's frame: north -z, east +x; facing the middle
  const az = THREE.MathUtils.degToRad(azDeg), el = THREE.MathUtils.degToRad(elDeg);
  m.position.set(dist * Math.cos(el) * Math.sin(az), dist * Math.sin(el), -dist * Math.cos(el) * Math.cos(az));
  m.scale.setScalar(width);
  m.lookAt(0, 0, 0);
  return m;
}

// The welcome view (panos.json: an entry with "welcome": true; its picture is Van Zyl Overlook, its colours muted a little): the four
// directions in the sky in white, 40 m away, and the title a few metres ahead.  The words hang in "world", so they
// keep their directions as the viewer turns.
const welcome = new THREE.Group();
welcome.visible = false;
world.add(welcome);
let welcomeBuilt = false;
function showWelcome(on) {
  if (on && !welcomeBuilt) {
    welcomeBuilt = true;
    for (const [name, az] of [['NORTH', 0], ['EAST', 90], ['SOUTH', 180], ['WEST', 270]])
      welcome.add(place(textPanel([{ text: name, px: 300, weight: 800 }], { width: 1400 }), az, 32, 40, 14));
    const az0 = THREE.MathUtils.radToDeg(yaw0);
    welcome.add(place(textPanel([{ text: 'MPPP stereo viewer', px: 230, weight: 900 },
                                 { text: 'Mars 2020 Perseverance rover', px: 150, weight: 700 }]), az0, 14, 5, 4.2));
    welcome.add(place(textPanel([{ text: 'trigger: next site   |   left trigger: back   |   stick: turn', px: 84, weight: 600 },
                                 { text: 'X: info and map   |   A: view   |   grip: rover on, off or 3D', px: 84, weight: 600 }],
                                { back: 'rgba(0,0,0,0.35)' }), az0, -6, 5, 3.6));
  }
  welcome.visible = !!on;
}

// X (key I): a small page with the site, the sol and a map of the traverse (over a low-resolution orbital picture,
// 0.98.14) with an x at this station.  In a headset
// it is attached to the left hand, above the controller and tilted towards the eyes; without a left controller, and
// on a screen, it hangs 2 m ahead of where the viewer looks.  A again puts it away.  (0.98.5)
const infoPanel = new THREE.Group();
infoPanel.visible = false;
scene.add(infoPanel);
let traverse = null, leftGrip = null, orthoImage = null;
for (let i = 0; i < 2; i++) {
  const g = renderer.xr.getControllerGrip(i);
  g.addEventListener('connected', e => { if (e.data && e.data.handedness === 'left') leftGrip = g; });
  g.addEventListener('disconnected', () => { if (leftGrip === g) { leftGrip = null; if (infoPanel.parent === g) { scene.add(infoPanel); infoPanel.visible = false; } } });
  scene.add(g);
}
function infoLines() {
  const p = panos[cur.s] || {};
  const m = /^Sol(\d+)/.exec(p.id || '');
  const sols = (p.sols && p.sols.length) ? p.sols : (m ? [parseInt(m[1], 10)] : []);
  const sol = sols.length ? (sols.length > 1 ? `sols ${sols[0]}-${sols[sols.length - 1]}` : `sol ${sols[0]}`) : '';
  return [p.site_name || p.title || p.id || '', sol, p.welcome ? '' : (p.id || '')];
}
function drawInfo() {
  while (infoPanel.children.length) { const o = infoPanel.children.pop(); o.material.map.dispose(); o.material.dispose(); o.geometry.dispose(); }
  const p = panos[cur.s] || {}, [name, sol, id] = infoLines();
  const hasMap = !!(traverse && traverse.xy && traverse.xy.length > 1);
  const W = 1100, Hh = hasMap ? 400 + (W - 120) + 60 : 420, c = document.createElement('canvas'), g = c.getContext('2d');   // 0.98.15: the map
  //                                                               fits (it ran 64 px past a 1240-px page) and the page is wider
  c.width = W; c.height = Hh;
  g.fillStyle = 'rgba(10,20,40,0.82)'; g.beginPath(); g.roundRect(0, 0, W, Hh, 40); g.fill();
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  const text = (t, y, px, weight, color) => {
    g.font = `${weight} ${px}px system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
    while (g.measureText(t).width > W - 80 && px > 20) { px -= 4; g.font = `${weight} ${px}px system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`; }
    g.fillStyle = color || '#fff'; g.fillText(t, W / 2, y);
  };
  text(name, 100, 96, 800); text(sol, 215, 84, 700); text(id, 320, 44, 500, '#bcd');
  if (hasMap) {                                                  // north up; the same scale east and north
    const x0 = 60, y0 = 400, S = W - 120, xy = traverse.xy;
    let ax = Infinity, bx = -Infinity, ay = Infinity, by = -Infinity;
    for (const [x, y] of xy) { ax = Math.min(ax, x); bx = Math.max(bx, x); ay = Math.min(ay, y); by = Math.max(by, y); }
    const k = (S - 60) / Math.max(bx - ax, by - ay, 1), ox = x0 + (S - k * (bx - ax)) / 2, oy = y0 + (S - k * (by - ay)) / 2;
    const X = x => ox + k * (x - ax), Y = y => oy + k * (by - y);
    g.fillStyle = 'rgba(255,255,255,0.07)'; g.fillRect(x0, y0, S, S);
    const o = traverse.ortho;
    if (orthoImage && o && o.extent) {                           // 0.98.14: the orbital picture under the line
      g.save(); g.beginPath(); g.rect(x0, y0, S, S); g.clip();
      g.drawImage(orthoImage, X(o.extent[0]), Y(o.extent[3]), k * (o.extent[2] - o.extent[0]), k * (o.extent[3] - o.extent[1]));
      g.restore();
    }
    const line = (colour, width) => {
      g.strokeStyle = colour; g.lineWidth = width; g.lineJoin = 'round'; g.beginPath();
      xy.forEach(([x, y], i) => (i ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y))));
      g.stroke();
    };
    if (orthoImage) line('rgba(0,0,0,0.55)', 9);                  // a dark edge, so the line reads on the picture
    line(orthoImage ? '#fff' : '#9ab', 4);
    if (p.map) {
      const mx = X(p.map[0]), my = Y(p.map[1]), r = 26;
      g.strokeStyle = '#ff5a3c'; g.lineWidth = 12; g.lineCap = 'round'; g.beginPath();
      g.moveTo(mx - r, my - r); g.lineTo(mx + r, my + r); g.moveTo(mx + r, my - r); g.lineTo(mx - r, my + r); g.stroke();
    }
    const km = 1000 * k, bar = km > S / 2 ? 0.5 : (km * 5 < S / 2 ? 5 : 1);       // a scale bar of 0.5, 1 or 5 km
    g.strokeStyle = '#fff'; g.lineWidth = 6; g.lineCap = 'butt'; g.beginPath(); g.moveTo(x0 + 24, y0 + S - 30); g.lineTo(x0 + 24 + bar * km, y0 + S - 30); g.stroke();
    g.textAlign = 'left'; g.font = '600 36px system-ui, sans-serif'; g.fillStyle = '#fff'; g.fillText(`${bar} km`, x0 + 24, y0 + S - 62);
    g.textAlign = 'right'; g.fillText('N ↑', x0 + S - 20, y0 + 36);
    if (orthoImage && o && o.credit) { g.font = '500 22px system-ui, sans-serif'; g.fillStyle = 'rgba(255,255,255,0.8)'; g.textAlign = 'left'; g.fillText(o.credit, x0 + 16, y0 + 30); }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, Hh / W),
                           new THREE.MeshBasicMaterial({ map: t, transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide }));
  m.renderOrder = 5; m.frustumCulled = false;
  infoPanel.add(m);
}
const fwd = new THREE.Vector3();
const INFO_TILT_RAD = -1.2;      // 0.98.14 (Christian: "Tilt the info window back further so that it is easier to read from the
//                                  wrist"): the page leans back 69 deg from upright on the controller (40 deg before)
function toggleInfo() {
  if (infoPanel.visible) { infoPanel.visible = false; return; }
  drawInfo();
  if (renderer.xr.isPresenting && leftGrip) {                    // on the left hand: 19 cm wide (16 until 0.98.14), above the controller
    leftGrip.add(infoPanel);
    infoPanel.position.set(0, 0.10, -0.07); infoPanel.rotation.set(INFO_TILT_RAD, 0, 0); infoPanel.scale.setScalar(0.19);
  } else {
    scene.add(infoPanel);
    const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
    cam.getWorldDirection(fwd);
    cam.getWorldPosition(infoPanel.position);
    const hlen = Math.hypot(fwd.x, fwd.z) || 1;                  // level with the eyes' heading, a little below the gaze line
    const el = Math.max(-0.6, Math.min(0.5, Math.atan2(fwd.y, hlen))) - 0.12;
    const at = infoPanel.position.clone();
    infoPanel.position.x += 2 * Math.cos(el) * fwd.x / hlen; infoPanel.position.z += 2 * Math.cos(el) * fwd.z / hlen;
    infoPanel.position.y += 2 * Math.sin(el);
    infoPanel.scale.setScalar(1.0);
    infoPanel.lookAt(at);
  }
  infoPanel.visible = true;
}

// ---------------------------------------------------------------- the list and the choice
let panos = [], base = '', cur = { s: 0, v: 0, w: 0 }, texture = null, loadId = 0, yaw0 = 0, turn = 0;
const maxTex = renderer.capabilities.maxTextureSize;

function variants(p) { return p.variants || []; }
function views(p, v) { return Object.keys((variants(p)[v] || {}).views || {}); }

function fill() {
  const p = panos[cur.s];
  $('station').innerHTML = panos.map((q, i) => `<option value="${i}">${q.title || q.id}</option>`).join('');
  $('station').value = cur.s;
  $('variant').innerHTML = variants(p).map((q, i) => `<option value="${i}">${q.label || q.key}</option>`).join('');
  $('variant').value = cur.v;
  $('view').innerHTML = views(p, cur.v).map((k, i) => `<option value="${i}">${k}</option>`).join('');
  $('view').value = cur.w;
}

async function show() {
  const p = panos[cur.s];
  if (!p) return;
  cur.v = Math.min(cur.v, Math.max(variants(p).length - 1, 0));
  const names = views(p, cur.v);
  cur.w = Math.min(cur.w, Math.max(names.length - 1, 0));
  fill();
  const vr = variants(p)[cur.v], file = vr && vr.views[names[cur.w]];
  if (!file) { msg('no image for this choice'); return; }
  history.replaceState(null, '', `#${p.id}/${vr.key}/${names[cur.w]}`);
  const id = ++loadId, url = new URL(file, base).href;
  msg(`loading ${p.title || p.id} ...`);
  try {
    const blob = await (await fetch(url)).blob();
    let bmp = await createImageBitmap(blob, { imageOrientation: 'flipY' });
    if (Math.max(bmp.width, bmp.height) > maxTex) {              // a device with smaller textures: reduce once
      const k = maxTex / Math.max(bmp.width, bmp.height);
      const small = await createImageBitmap(blob, { imageOrientation: 'flipY', resizeWidth: Math.floor(bmp.width * k),
                                                    resizeHeight: Math.floor(bmp.height * k), resizeQuality: 'high' });
      bmp.close(); bmp = small;
    }
    if (id !== loadId) { bmp.close(); return; }                  // another choice was made meanwhile
    const t = new THREE.Texture(bmp);
    t.flipY = false;                                             // flipped at decode (ImageBitmap)
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = THREE.RepeatWrapping;
    t.generateMipmaps = true;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    t.needsUpdate = true;
    if (texture) { texture.dispose(); if (texture.image && texture.image.close) texture.image.close(); }
    texture = t;
    material.map = t; material.color.set(0xffffff); material.needsUpdate = true;
    showMark(/^(standard|enhanced)/.test(names[cur.w]) ? vr.ground_mark : null);   // not over the range and normal views
    showRover(/^(standard|enhanced)/.test(names[cur.w]) ? vr.rover_surface : null);
    yaw0 = THREE.MathUtils.degToRad(p.yaw_deg || 0);              // the azimuth (deg east of north) straight ahead at the start
    world.rotation.y = yaw0 + turn;                               // ... and what the viewer has turned since (thumbstick)
    showWelcome(!!p.welcome);
    if (infoPanel.visible) drawInfo();
    $('note').textContent = [p.title || p.id, p.note, vr.label, `${bmp.width} x ${bmp.height}`, p.mppp ? `MPPP ${p.mppp}` : '']
      .filter(Boolean).join('  |  ');
    msg('');
  } catch (e) { if (id === loadId) msg(`could not load ${url}: ${e.message || e}`); }
}

const colour = k => /^(standard|enhanced)/.test(k);
function step(what, d) {
  const p = panos[cur.s];
  if (what === 'c') {                                            // X: the next colour view (not the range or normal views)
    const names = views(p, cur.v);
    for (let i = 1; i <= names.length; i++) { const j = (cur.w + i) % names.length; if (colour(names[j])) { cur.w = j; break; } }
    show(); return;
  }
  if (what === 's') cur.s = (cur.s + d + panos.length) % panos.length;
  if (what === 'v') cur.v = (cur.v + d + variants(p).length) % Math.max(variants(p).length, 1);
  if (what === 'w') cur.w = (cur.w + d + views(p, cur.v).length) % Math.max(views(p, cur.v).length, 1);
  show();
}

function fromHash() {
  const [sid, vkey, wkey] = decodeURIComponent(location.hash.slice(1)).split('/');
  const s = panos.findIndex(p => p.id === sid);
  if (s < 0) return;
  cur.s = s;
  const v = variants(panos[s]).findIndex(q => q.key === vkey);
  cur.v = v < 0 ? 0 : v;
  const w = views(panos[s], cur.v).indexOf(wkey);
  cur.w = w < 0 ? 0 : w;
}

$('station').onchange = e => { cur.s = +e.target.value; show(); };
$('variant').onchange = e => { cur.v = +e.target.value; show(); };
$('view').onchange = e => { cur.w = +e.target.value; show(); };
$('eye').onchange = e => { setEye(e.target.value); };
window.addEventListener('hashchange', () => { fromHash(); show(); });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') step('s', 1); else if (e.key === 'ArrowLeft') step('s', -1);
  else if (e.key === 'v' || e.key === 'V') step('v', 1); else if (e.key === 'e' || e.key === 'E') step('w', 1);
  else if (e.key === 'l' || e.key === 'L') setEye(screenEye === 'left' ? 'right' : 'left');
  else if (e.key === 'm' || e.key === 'M') { markOn = !markOn; markDisc.visible = markOn && !!markMaterial.map; }
  else if (e.key === 'r' || e.key === 'R') { roverOn = !roverOn; for (const m of roverParts) m.visible = roverOn; }
  else if (e.key === 'i' || e.key === 'I') toggleInfo();
});

// ---------------------------------------------------------------- looking around on a screen
let yaw = 0, pitch = 0, drag = null;
function look() {
  pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
  camera.rotation.set(pitch, -yaw, 0, 'YXZ');                    // yaw: azimuth, positive towards the east
}
const el = renderer.domElement;
el.style.touchAction = 'none';
el.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointerup', () => { drag = null; });
el.addEventListener('pointermove', e => {
  if (!drag || renderer.xr.isPresenting) return;
  const k = THREE.MathUtils.degToRad(camera.fov) / window.innerHeight;
  yaw -= (e.clientX - drag.x) * k; pitch += (e.clientY - drag.y) * k;
  drag = { x: e.clientX, y: e.clientY };
  look();
});
el.addEventListener('wheel', e => {
  camera.fov = Math.max(15, Math.min(100, camera.fov * (e.deltaY > 0 ? 1.1 : 0.9)));
  camera.updateProjectionMatrix();
}, { passive: true });
$('north').onclick = () => { yaw = -world.rotation.y; pitch = 0; look(); };
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------- headset: controller buttons
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  c.addEventListener('selectstart', e => step('s', e.data && e.data.handedness === 'left' ? -1 : 1));   // right trigger: next
  //                                                                                       station; left trigger: the one before
  c.addEventListener('squeezestart', () => step('v', 1));        // grip: variant
  scene.add(c);
}
const held = new Map();
const TURN_DEG_S = 150, STICK_DEAD = 0.25;                     // 0.98.14: 150 deg / s at full stick (60 before: "should be faster")
function buttons(dt) {                                           // button 4 is A on the right hand and X on the left
  const session = renderer.xr.getSession();
  if (!session) return;
  for (const src of session.inputSources) {
    const gp = src.gamepad;
    if (!gp) continue;
    const b = gp.buttons[4];
    const was = held.get(src) || false, is = !!(b && b.pressed);
    if (is && !was) { if (src.handedness === 'left') toggleInfo(); else step('w', 1); }      // 0.98.13: X (left): info; A (right): the next view
    held.set(src, is);
    const x = gp.axes.length >= 4 ? gp.axes[2] : (gp.axes[0] || 0);                          // thumbstick left / right
    if (Math.abs(x) > STICK_DEAD) {                                                          // right: the view turns to the right
      turn += THREE.MathUtils.degToRad(TURN_DEG_S) * dt * Math.sign(x) * (Math.abs(x) - STICK_DEAD) / (1 - STICK_DEAD);
      world.rotation.y = yaw0 + turn;
    }
  }
}

const headOffset = new THREE.Vector3(...((new URLSearchParams(location.search).get('head') || '0,0,0').split(',').map(Number).concat([0, 0, 0]).slice(0, 3).map(v => v || 0)));
const head = new THREE.Vector3(), gaze = new THREE.Vector3(), upv = new THREE.Vector3(), clock = new THREE.Clock();
function turnMarkText() {                                        // the ring's text upright for the viewer: its middle ahead of them
  if (!markDisc.visible) return;
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  cam.getWorldDirection(gaze);
  upv.set(0, 1, 0).applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()));
  gaze.add(upv);                                                 // looking straight down, "ahead" is where the head's top points
  if (Math.hypot(gaze.x, gaze.z) < 1e-3) return;
  const heading = Math.atan2(gaze.x, -gaze.z) + world.rotation.y;                 // east of the panorama's north
  let d = -(heading - markTextAz) - markOuter.rotation.z;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  markOuter.rotation.z += d * 0.15;                              // eased: it does not twitch with the head
}
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  turnMarkText();
  if (renderer.xr.isPresenting) {                                // the spheres stay centred on the head: an omnidirectional
    renderer.xr.getCamera().getWorldPosition(head);              // stereo pair has no parallax to give for head movement
    world.position.copy(head);
    if (!anchored) { fixed.position.copy(head); anchored = true; }   // the rover surface stays there: it has parallax
    buttons(dt);
  } else {                                                       // on a screen: ?head=x,y,z (m: east, up, south) moves the eye off
    camera.position.copy(headOffset);                            // the pivot, to look at the 3D rover's parallax (0.98.14)
    world.position.copy(headOffset); fixed.position.set(0, 0, 0);
  }
  fixed.rotation.y = world.rotation.y;
  renderer.render(scene, camera);
});

// ---------------------------------------------------------------- what this device can show (0.97.4)
function diagnostics() {
  const gl = renderer.getContext();
  const ext = n => !!gl.getExtension(n);
  const d = { maxTexture: maxTex, maxCube: gl.getParameter(gl.MAX_CUBE_MAP_TEXTURE_SIZE), webgl2: renderer.capabilities.isWebGL2 !== false,
              astc: ext('WEBGL_compressed_texture_astc'), etc2: ext('WEBGL_compressed_texture_etc'),
              bc7: ext('EXT_texture_compression_bptc'), s3tc: ext('WEBGL_compressed_texture_s3tc'),
              anisotropy: renderer.capabilities.getMaxAnisotropy(), memoryGB: navigator.deviceMemory || null, xr: !!navigator.xr };
  const fmt = ['astc', 'etc2', 'bc7', 's3tc'].filter(k => d[k]).join(' ') || 'none';
  $('diag').textContent = `max texture ${d.maxTexture} | compressed: ${fmt}` + (d.memoryGB ? ` | memory >= ${d.memoryGB} GB` : '') +
    ` | 16K eye as one texture: ${d.maxTexture >= 16384 ? 'yes' : 'no'}`;
  console.log('MPPP viewer diagnostics', JSON.stringify(d));
  window.mpppDiagnostics = d;
}
diagnostics();

// ---------------------------------------------------------------- start
(async () => {
  const index = new URL(new URLSearchParams(location.search).get('index') || 'panos.json', location.href);
  base = index.href;
  try {
    const j = await (await fetch(index, { cache: 'no-cache' })).json();
    panos = j.panos || j;
    traverse = j.traverse || null;
    if (traverse && traverse.ortho && traverse.ortho.file)       // the map's orbital picture: small, fetched once
      fetch(new URL(traverse.ortho.file, base).href).then(r => r.blob()).then(createImageBitmap)
        .then(b => { orthoImage = b; if (infoPanel.visible) drawInfo(); }).catch(e => console.warn('map picture', e));
    if (j.title) { $('title').textContent = j.title; document.title = j.title; }
  } catch (e) { msg(`no image list at ${index.href} (${e.message || e})`); return; }
  if (!panos.length) { msg('the image list is empty'); return; }
  fromHash();
  look();
  show();
})();
</script>
</body>
</html>
