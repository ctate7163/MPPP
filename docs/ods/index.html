<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MPPP stereo panoramas</title>
<!--
  MPPP stereo 360 viewer (prototype, 0.97.3).  One static page: three.js (vendor/, r170, MIT) and panos.json.
  Images: <name>_360_3DTD.jpg from `mppp ods` - square, the left eye on top of the right, each an equirectangular
  panorama whose left edge looks north with azimuth growing eastward.
  Link to one view:   .../ods/#<station>/<variant>/<view>      e.g.  #Sol0052_S003D2046/rover/enhanced
  Another image list: .../ods/?index=https://<same origin or CORS-enabled host>/panos.json
  Keys: left / right arrows = station, V = variant, E = view, drag = look, wheel = zoom.
  Headset: trigger = next station, grip = variant, A or X button = view.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; left: 0; right: 0; top: 0; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
         background: linear-gradient(#000c, #0000); z-index: 2; }
  #bar select, #bar button { background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; font: inherit; }
  #title { font-weight: 600; margin-right: 6px; }
  #note { position: fixed; left: 10px; bottom: 10px; right: 170px; color: #bbb; font-size: 12px; z-index: 2; text-shadow: 0 0 4px #000; }
  #diag { position: fixed; right: 170px; bottom: 10px; color: #888; font-size: 11px; z-index: 2; text-shadow: 0 0 4px #000; text-align: right; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 1;
         font-size: 16px; text-shadow: 0 0 6px #000; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="bar">
  <span id="title">MPPP stereo panoramas</span>
  <select id="station" title="station"></select>
  <select id="variant" title="variant"></select>
  <select id="view" title="view"></select>
  <button id="north" title="look north">N</button>
</div>
<div id="msg">loading the list ...</div>
<div id="note"></div>
<div id="diag" title="what this device can show"></div>
<script type="module">
import * as THREE from 'three';
import { VRButton } from './vendor/VRButton.js';

const $ = id => document.getElementById(id);
const msg = t => { $('msg').textContent = t || ''; };

// ---------------------------------------------------------------- scene: one sphere per eye, the viewer at its centre
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
camera.layers.enable(1);                       // on a screen: the left eye's image
const world = new THREE.Group();               // turned about the vertical for the start heading
scene.add(world);

// The equirect grid as a sphere seen from inside: azimuth az from north (-z) towards east (+x), elevation el up (+y).
// u = az / 2 pi; the texture's upper half is the left eye (v 0.5-1 with three's flipped y), the lower half the right.
function eyeSphere(eye, texel) {
  const W = 128, H = 64, R = 50, pos = [], uv = [], idx = [];
  const v0 = eye === 'left' ? 0.5 : 0.0;
  for (let j = 0; j <= H; j++) {
    const el = Math.PI / 2 - j / H * Math.PI;
    for (let i = 0; i <= W; i++) {
      const az = i / W * 2 * Math.PI;
      pos.push(R * Math.cos(el) * Math.sin(az), R * Math.sin(el), -R * Math.cos(el) * Math.cos(az));
      const v = v0 + 0.5 * (1 - j / H);
      uv.push(i / W, Math.min(v0 + 0.5 - texel, Math.max(v0 + texel, v)));      // half a texel off the other eye's rows
    }
  }
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const a = j * (W + 1) + i, b = a + 1, c = a + W + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
const material = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide, depthTest: false, depthWrite: false });
const spheres = {};
for (const [eye, layer] of [['left', 1], ['right', 2]]) {      // three.js: the XR left camera sees layer 1, the right layer 2
  const m = new THREE.Mesh(eyeSphere(eye, 0.5 / 8192), material);
  m.layers.set(layer);
  m.frustumCulled = false;
  world.add(m);
  spheres[eye] = m;
}

// ---------------------------------------------------------------- the list and the choice
let panos = [], base = '', cur = { s: 0, v: 0, w: 0 }, texture = null, loadId = 0;
const maxTex = renderer.capabilities.maxTextureSize;

function variants(p) { return p.variants || []; }
function views(p, v) { return Object.keys((variants(p)[v] || {}).views || {}); }

function fill() {
  const p = panos[cur.s];
  $('station').innerHTML = panos.map((q, i) => `<option value="${i}">${q.title || q.id}</option>`).join('');
  $('station').value = cur.s;
  $('variant').innerHTML = variants(p).map((q, i) => `<option value="${i}">${q.label || q.key}</option>`).join('');
  $('variant').value = cur.v;
  $('view').innerHTML = views(p, cur.v).map((k, i) => `<option value="${i}">${k}</option>`).join('');
  $('view').value = cur.w;
}

async function show() {
  const p = panos[cur.s];
  if (!p) return;
  cur.v = Math.min(cur.v, Math.max(variants(p).length - 1, 0));
  const names = views(p, cur.v);
  cur.w = Math.min(cur.w, Math.max(names.length - 1, 0));
  fill();
  const vr = variants(p)[cur.v], file = vr && vr.views[names[cur.w]];
  if (!file) { msg('no image for this choice'); return; }
  history.replaceState(null, '', `#${p.id}/${vr.key}/${names[cur.w]}`);
  const id = ++loadId, url = new URL(file, base).href;
  msg(`loading ${p.title || p.id} ...`);
  try {
    const blob = await (await fetch(url)).blob();
    let bmp = await createImageBitmap(blob, { imageOrientation: 'flipY' });
    if (Math.max(bmp.width, bmp.height) > maxTex) {              // a device with smaller textures: reduce once
      const k = maxTex / Math.max(bmp.width, bmp.height);
      const small = await createImageBitmap(blob, { imageOrientation: 'flipY', resizeWidth: Math.floor(bmp.width * k),
                                                    resizeHeight: Math.floor(bmp.height * k), resizeQuality: 'high' });
      bmp.close(); bmp = small;
    }
    if (id !== loadId) { bmp.close(); return; }                  // another choice was made meanwhile
    const t = new THREE.Texture(bmp);
    t.flipY = false;                                             // flipped at decode (ImageBitmap)
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = THREE.RepeatWrapping;
    t.generateMipmaps = true;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    t.needsUpdate = true;
    if (texture) { texture.dispose(); if (texture.image && texture.image.close) texture.image.close(); }
    texture = t;
    material.map = t; material.color.set(0xffffff); material.needsUpdate = true;
    world.rotation.y = THREE.MathUtils.degToRad(p.yaw_deg || 0);  // the azimuth (deg east of north) straight ahead at the start
    $('note').textContent = [p.title || p.id, p.note, vr.label, `${bmp.width} x ${bmp.height}`, p.mppp ? `MPPP ${p.mppp}` : '']
      .filter(Boolean).join('  |  ');
    msg('');
  } catch (e) { if (id === loadId) msg(`could not load ${url}: ${e.message || e}`); }
}

function step(what, d) {
  const p = panos[cur.s];
  if (what === 's') cur.s = (cur.s + d + panos.length) % panos.length;
  if (what === 'v') cur.v = (cur.v + d + variants(p).length) % Math.max(variants(p).length, 1);
  if (what === 'w') cur.w = (cur.w + d + views(p, cur.v).length) % Math.max(views(p, cur.v).length, 1);
  show();
}

function fromHash() {
  const [sid, vkey, wkey] = decodeURIComponent(location.hash.slice(1)).split('/');
  const s = panos.findIndex(p => p.id === sid);
  if (s < 0) return;
  cur.s = s;
  const v = variants(panos[s]).findIndex(q => q.key === vkey);
  cur.v = v < 0 ? 0 : v;
  const w = views(panos[s], cur.v).indexOf(wkey);
  cur.w = w < 0 ? 0 : w;
}

$('station').onchange = e => { cur.s = +e.target.value; show(); };
$('variant').onchange = e => { cur.v = +e.target.value; show(); };
$('view').onchange = e => { cur.w = +e.target.value; show(); };
window.addEventListener('hashchange', () => { fromHash(); show(); });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') step('s', 1); else if (e.key === 'ArrowLeft') step('s', -1);
  else if (e.key === 'v' || e.key === 'V') step('v', 1); else if (e.key === 'e' || e.key === 'E') step('w', 1);
});

// ---------------------------------------------------------------- looking around on a screen
let yaw = 0, pitch = 0, drag = null;
function look() {
  pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
  camera.rotation.set(pitch, -yaw, 0, 'YXZ');                    // yaw: azimuth, positive towards the east
}
const el = renderer.domElement;
el.style.touchAction = 'none';
el.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointerup', () => { drag = null; });
el.addEventListener('pointermove', e => {
  if (!drag || renderer.xr.isPresenting) return;
  const k = THREE.MathUtils.degToRad(camera.fov) / window.innerHeight;
  yaw -= (e.clientX - drag.x) * k; pitch += (e.clientY - drag.y) * k;
  drag = { x: e.clientX, y: e.clientY };
  look();
});
el.addEventListener('wheel', e => {
  camera.fov = Math.max(15, Math.min(100, camera.fov * (e.deltaY > 0 ? 1.1 : 0.9)));
  camera.updateProjectionMatrix();
}, { passive: true });
$('north').onclick = () => { yaw = -world.rotation.y; pitch = 0; look(); };
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------- headset: controller buttons
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  c.addEventListener('selectstart', () => step('s', 1));         // trigger: next station
  c.addEventListener('squeezestart', () => step('v', 1));        // grip: variant
  scene.add(c);
}
const held = new Map();
function buttons() {                                             // A / X (button 4): view
  const session = renderer.xr.getSession();
  if (!session) return;
  for (const src of session.inputSources) {
    const b = src.gamepad && src.gamepad.buttons[4];
    const was = held.get(src) || false, is = !!(b && b.pressed);
    if (is && !was) step('w', 1);
    held.set(src, is);
  }
}

const head = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  if (renderer.xr.isPresenting) {                                // the spheres stay centred on the head: an omnidirectional
    renderer.xr.getCamera().getWorldPosition(head);              // stereo pair has no parallax to give for head movement
    world.position.copy(head);
    buttons();
  } else world.position.set(0, 0, 0);
  renderer.render(scene, camera);
});

// ---------------------------------------------------------------- what this device can show (0.97.4)
function diagnostics() {
  const gl = renderer.getContext();
  const ext = n => !!gl.getExtension(n);
  const d = { maxTexture: maxTex, maxCube: gl.getParameter(gl.MAX_CUBE_MAP_TEXTURE_SIZE), webgl2: renderer.capabilities.isWebGL2 !== false,
              astc: ext('WEBGL_compressed_texture_astc'), etc2: ext('WEBGL_compressed_texture_etc'),
              bc7: ext('EXT_texture_compression_bptc'), s3tc: ext('WEBGL_compressed_texture_s3tc'),
              anisotropy: renderer.capabilities.getMaxAnisotropy(), memoryGB: navigator.deviceMemory || null, xr: !!navigator.xr };
  const fmt = ['astc', 'etc2', 'bc7', 's3tc'].filter(k => d[k]).join(' ') || 'none';
  $('diag').textContent = `max texture ${d.maxTexture} | compressed: ${fmt}` + (d.memoryGB ? ` | memory >= ${d.memoryGB} GB` : '') +
    ` | 16K eye as one texture: ${d.maxTexture >= 16384 ? 'yes' : 'no'}`;
  console.log('MPPP viewer diagnostics', JSON.stringify(d));
  window.mpppDiagnostics = d;
}
diagnostics();

// ---------------------------------------------------------------- start
(async () => {
  const index = new URL(new URLSearchParams(location.search).get('index') || 'panos.json', location.href);
  base = index.href;
  try {
    const j = await (await fetch(index, { cache: 'no-cache' })).json();
    panos = j.panos || j;
    if (j.title) { $('title').textContent = j.title; document.title = j.title; }
  } catch (e) { msg(`no image list at ${index.href} (${e.message || e})`); return; }
  if (!panos.length) { msg('the image list is empty'); return; }
  fromHash();
  look();
  show();
})();
</script>
</body>
</html>
