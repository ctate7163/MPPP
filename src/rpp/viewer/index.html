<title>Rover Photogrammetry Viewer (RPV)</title>
<script>
// 0.98.29 (Christian, 16 Nov 2026: "change https://ctate7163.github.io/rpp/ods/ to https://ctate7163.github.io/RPV/"):
// the viewer lives in its own repository, ctate7163/RPV.  This page, still in the pipeline's docs at /RPP/ods/ (and
// /MPPP/ods/ before the repository was renamed), sends the visitor there with the station link and any ?index=.
// 0.99.13 (Christian, 17 Nov 2026: "let's make the website https://ctate7163.github.io/rpv have a lower case rpv instead of
// RPV. Redirected https://ctate7163.github.io/RPV/ to https://ctate7163.github.io/rpv/"): the repository is ctate7163/rpv;
// a copy of this page still served under /RPV/ sends the visitor on too.
if (location.hostname === 'ctate7163.github.io' && (/^\/(RPP|MPPP)\/ods(\/|$)/i.test(location.pathname)
                                                   || /^\/RPV(\/|$)/.test(location.pathname)))
  location.replace('https://ctate7163.github.io/rpv/' + location.search + location.hash);
</script>
<!--
  RPP stereo 360 viewer (prototype, 0.97.3; 0.97.18: the eye shown on a screen can be chosen).  One static page: three.js (vendor/, r170, MIT) and panos.json.
  Images: <name>_360_3DTD.jpg from `rpp ods` - square, the left eye on top of the right, each an equirectangular
  panorama whose left edge looks north with azimuth growing eastward.
  Hosted at https://ctate7163.github.io/rpv/ (the repository ctate7163/rpv; 0.98.29, lower case since 0.99.13) - a copy of this file that
  rpp single-sites --upload installs there (this file is rpp/viewer/index.html of the RPP package).
  Link to one view:   https://ctate7163.github.io/rpv/#<station>/<variant>/<view>      e.g.  #Sol0052/rover/enhanced (a 0.99 link #Sol0052_S003D2046/... still opens it)
  Another image list: .../rpv/?index=https://<same origin or CORS-enabled host>/panos.json
  0.99.40: the menu is the terrain - terrain stereo (the panoramas), terrain local 3D (the textured terrain within 20 m
  in front of the terrain-only panorama), terrain full 3D (one textured surface to the horizon and the sky, no
  panorama); the rover button / R shows or hides the rover (in stereo the with-rover panorama, in 3D the 3D rover);
  the drive (the full 3D terrain and the rover) is the steering wheel above the rover button (1.0: shown wherever the
  station has it; ?experimental=1 only in 0.99.40-0.99.53).
  A link may end in /no-rover (a 3D mode with the rover hidden).
  Keys: left / right arrows = station (in the drive the arrows drive the rover), V = terrain, E or space = view
  (0.99.37: space, Shift+space back), R = the rover on / off as the rover button (0.99.37), I = info,
  L = the next eye (on a screen: left, right, and the center where the station has it), P = the screen's eye movement on / off (0.99.32), drag = look, wheel = zoom;
  0.98.19: W A S D held = look up / left / down / right, Shift+N / E / S / W = face that way, N = north, O = the front of the
  rover, level (0.98.28: its +x; 45 degrees down before); also the N E S W O cross at the upper right of the screen.
  Headset (0.98.4): right trigger = next station, left trigger = the one before, thumbstick left / right = turn,
  X = info page on the left hand (site, sol, map), A = the next view (0.99.37: standard color, raw color, enhanced color,
  enhanced tone, dcs color, normal map, distance map),
  either grip = the rover on / off (0.99.52; 0.99.40: right grip = terrain), Y held 1 s = leave VR (0.99.52)   (0.98.13: A and X swapped)
  0.98.28: Y = home (the welcome view, facing west); on a screen the house button or H.  0.99.41: B = terrain stereo <->
  terrain full 3D (the color skins are in both; before, B was terrain only and again the next color skin).  1.0: each
  switch shows the standard color.
  The 3D rover is set again at the eyes' center whenever the station, the variant or the view changes and when R
  shows it.
  O = straight ahead of the rover (its +x, level); the N E S W O cross is at the upper right.
  (terrain only, terrain with rover (projected), terrain with rover (3D model), 3D terrain and rover, 3D terrain to
  the horizon and rover).  0.99.32: the fifth - one textured surface from under the rover to the far field and the sky
  (no panorama behind it); the near terrain fades out at its rim; on a screen the eye moves a little (in front of the
  turning point, with the pointer, and a slow sway when left alone; P turns that off).
  0.99.33: a sixth, "Drive the rover (simulation)" - the fifth mode's surface with the rover moved over it by the two
  thumbsticks (forward / back: the track on that side; 1.0: left / right turns the rover, not the view; on a screen
  the arrow keys); the viewer rides at the mast.
  0.99.26: 3D terrain and rover - the terrain within 10 m (20 m from 0.99.39) and the rover as textured surfaces (true parallax), the
  terrain-only panorama beyond; the head may move 1 m from where the mode started, then the surface comes along.
-->
<style>

             grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 4px; }
  #compass button { background: #222c; color: #eee; border: 1px solid #555; border-radius: 6px; font: inherit; font-weight: 700; }

  /* 0.99.13 (Christian, 17 Nov 2026: "left arrow and right arrow buttons on the lower right to take the scene to the previous

  #nav button:hover { background: #444; }

  /* 0.99.41 (Christian, 19 Nov 2026: "make the home and rover icon orange too"; "the rover icon should be the way it is

  #nav button#roverBtn { color: #ff9500; }

  #driveBeta { position: absolute; right: calc(100% + 6px); bottom: calc(100% + 18px); display: none; font-size: 11px;

<body>

<script type="module">
import * as THREE from 'three';
import { VRButton } from './vendor/VRButton.js';

const $ = id => document.getElementById(id);
const msg = t => { $('msg').textContent = t || ''; };

// ---------------------------------------------------------------- scene: one sphere per eye, the viewer at its center
const renderer = new THREE.WebGLRenderer({ antialias: true });   // 0.98.14: the rover model's edges (false until then)
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
document.body.appendChild(renderer.domElement);
const vrButton = VRButton.createButton(renderer);
document.body.appendChild(vrButton);
// 0.98.28 (Christian, 16 Nov 2026: "make the Enter VR button a little larger if supported")
if (navigator.xr && navigator.xr.isSessionSupported)
  navigator.xr.isSessionSupported('immersive-vr').then(ok => { if (ok) vrButton.classList.add('rpv-big'); }).catch(() => {});

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 6000);   // 0.99.32: the fifth mode's sky is 3 km off
// On a screen one eye's panorama is shown: the left (layer 1) or the right (layer 2), chosen in the bar (0.97.18).
// In a headset three.js gives its left camera layer 1 and its right camera layer 2 ON TOP OF this camera's layers,
// so this camera must carry neither while a session runs - else one eye would be given both panoramas.
// 0.99.36 (Christian, 19 Nov 2026: "for the rpv browser layer, include center with the left and right eye if center is
// available"): a third choice on a screen, the panorama from the pivot itself (layer 3), where the variant has one
// (panos.json: "center": {view: file}); a headset still shows the two eyes.  wantEye is the choice, screenEye what is
// shown: the left eye while the station, variant or view has no center picture.
let screenEye = 'left', wantEye = 'left', centerOk = false;
const EYE_LAYER = { left: 1, right: 2, center: 3 };
function setEye(e) {
  wantEye = e === 'right' ? 'right' : e === 'center' ? 'center' : 'left';
  screenEye = wantEye === 'center' && !centerOk ? 'left' : wantEye;
  camera.layers.set(0);
  if (!renderer.xr.isPresenting) camera.layers.enable(EYE_LAYER[screenEye]);
  const sel = document.getElementById('eye');
  if (sel) sel.value = screenEye;
  if (screenEye === 'center' && typeof loadCenter === 'function') loadCenter();
  else if (typeof setNote === 'function') setNote();
}
setEye('left');
renderer.xr.addEventListener('sessionstart', () => { camera.layers.set(0); });
renderer.xr.addEventListener('sessionend', () => { setEye(wantEye); });
const world = new THREE.Group();               // turned about the vertical for the start heading
scene.add(world);

// The equirect grid as a sphere seen from inside: azimuth az from north (-z) toward east (+x), elevation el up (+y).
// u = az / 2 pi; the texture's upper half is the left eye (v 0.5-1 with three's flipped y), the lower half the right.
function eyeSphere(eye, texel) {
  const W = 128, H = 64, R = 50, pos = [], uv = [], idx = [];
  const v0 = eye === 'left' ? 0.5 : 0.0, span = eye === 'center' ? 1.0 : 0.5;   // 0.99.36: the center picture is one eye, 2:1
  for (let j = 0; j <= H; j++) {
    const el = Math.PI / 2 - j / H * Math.PI;
    for (let i = 0; i <= W; i++) {
      const az = i / W * 2 * Math.PI;
      pos.push(R * Math.cos(el) * Math.sin(az), R * Math.sin(el), -R * Math.cos(el) * Math.cos(az));
      const v = v0 + span * (1 - j / H);
      uv.push(i / W, Math.min(v0 + span - texel, Math.max(v0 + texel, v)));      // half a texel off the other eye's rows
    }
  }
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const a = j * (W + 1) + i, b = a + 1, c = a + W + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
const material = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide, depthTest: false, depthWrite: false });
const spheres = {};
const centerMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide, depthTest: false, depthWrite: false });
for (const [eye, layer] of [['left', 1], ['right', 2], ['center', 3]]) {   // three.js: the XR left camera sees layer 1, the right
  const m = new THREE.Mesh(eyeSphere(eye, 0.5 / 8192), eye === 'center' ? centerMaterial : material);   // layer 2; a screen 3
  m.layers.set(layer);
  m.frustumCulled = false;
  world.add(m);
  spheres[eye] = m;
}

// ---------------------------------------------------------------- the nadir mark as a surface on the ground (0.97.24)
// In the panorama the mark's two eyes come from an omnidirectional pair whose separation shrinks toward the nadir, so
// straight down it sits at no sensible distance and its text is hard to read.  Here it is a real disc: a little wider
// than the mark in the panorama (which it covers), lying depth_m below the eyes, drawn by both eye cameras of the
// headset from where they are - its disparity is that of a thing on the ground.  panos.json gives each variant's
// "ground_mark": {file, depth_m, radius_m}.  The picture is the mark from above, north up and east to the right:
// a circle in the x-y plane turned to lie flat has its +y at north (-z) and its +x at east, as the spheres do.
// M shows and hides it.
const markMaterial = new THREE.MeshBasicMaterial({ transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide });
// 0.98.4: the disc is two parts of the one picture.  The inner circle (the compass) stays fixed to north; the outer
// ring (the text) turns about the vertical so that its text is upright for the viewer, whichever way they face.
// It lies at ground level in both variants (panos.json gives the with-rover variant the terrain's depth).
const MARK_SPLIT = 0.53;                        // the compass ends at 0.50 of the radius, the text begins at 0.56
function discPart(g) {                          // texture coordinates of the whole picture: the unit disc in a square
  const p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + 1) / 2, (p.getY(i) + 1) / 2);
  const m = new THREE.Mesh(g, markMaterial);
  m.renderOrder = 2; m.frustumCulled = false;   // after the spheres
  return m;
}
const markDisc = new THREE.Group();             // x east, y north before it is laid flat
let markInner = null, markOuter = null, markSplit = 0;
function cutMark(split) {                       // 0.98.7: the cut follows the picture (ground_mark.split)
  if (split === markSplit) return;
  const turn = markOuter ? markOuter.rotation.z : 0;
  for (const m of [markInner, markOuter]) if (m) { markDisc.remove(m); m.geometry.dispose(); }
  markInner = discPart(new THREE.CircleGeometry(split, 96));
  markOuter = discPart(new THREE.RingGeometry(split, 1, 96, 1));
  markOuter.rotation.z = turn;
  markDisc.add(markInner, markOuter);
  markSplit = split;
}
cutMark(MARK_SPLIT);
markDisc.rotation.x = -Math.PI / 2;
markDisc.visible = false;
world.add(markDisc);
let markOn = true, markId = 0, markTextAz = 0;
async function showMark(gm) {
  const id = ++markId;
  markDisc.visible = false;
  if (!gm || !gm.file || !(gm.depth_m > 0) || !(gm.radius_m > 0)) return;
  try {
    const bmp = await createImageBitmap(await (await fetch(new URL(gm.file, base).href)).blob(), { imageOrientation: 'flipY' });
    if (id !== markId) { bmp.close(); return; }
    const t = new THREE.Texture(bmp);
    t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = true;
    t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    t.needsUpdate = true;
    if (markMaterial.map) { const o = markMaterial.map; markMaterial.map = null; o.dispose(); if (o.image && o.image.close) o.image.close(); }
    markMaterial.map = t; markMaterial.needsUpdate = true;
    cutMark(gm.split > 0.2 && gm.split < 0.9 ? gm.split : MARK_SPLIT);
    markDisc.scale.set(gm.radius_m, gm.radius_m, 1);
    markDisc.position.set(0, -gm.depth_m, 0);
    markTextAz = THREE.MathUtils.degToRad(gm.text_centre_azimuth_deg || 0);    // where the text's middle is in the picture
    markDisc.visible = markOn;
  } catch (e) { console.warn('ground mark', e); }
}

// ---------------------------------------------------------------- the rover as a 3D model (0.98.14)
// panos.json may give a variant a "rover_surface": {file}: a binary glTF written by rpp.ibr.rover_surface - the
// Perseverance model where it stands at this station, in meters about the eyes' pivot (x east, y up, z south: this
// page's frame), with two images: the panorama from the pivot (the rows that hold the rover) and its range.
// A point of the model takes the panorama's color in its direction when it is the surface the pivot sees there
// (its distance against the range image, weighted over the four range pixels around it: a smooth border); what the
// pivot does not see - no camera saw it - is the rover gray, shaded a little by its slope.  The model is a real
// surface with all its sides, so it shifts against the terrain when the head moves and has no holes.  R shows and
// hides it.  It hangs in "fixed", a group that stays where the head was when it appeared (the spheres follow the head).
// (A file of 0.98.2-0.98.13 - a grid mesh with its own texture coordinates - is still shown, as it was.)
const fixed = new THREE.Group();
scene.add(fixed);
let roverParts = [], roverOn = false, roverId = 0, anchored = false;     // 0.99.40: roverOn - the rover shown (button R)
renderer.xr.addEventListener('sessionstart', () => { anchored = false; });
const ROVER_VERT = `
  varying vec3 vP;
  void main() { vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const ROVER_FRAG = `
  precision highp float;
  varying vec3 vP;
  uniform sampler2D colorMap, rangeMap;
  uniform vec2 panoSize, rangeSize;      // the panorama (px); the range image (px)
  uniform vec2 rows;                     // the first panorama row of the images, and their number of rows
  uniform float az0, rangeStep, rangeOffset, unitsPerM, biasM, biasRel, grayShade;
  uniform vec3 gray;

});

// ---------------------------------------------------------------- looking around on a screen
let yaw = 0, pitch = 0, drag = null;
// 0.99.32 (Christian, 18 Nov 2026: "many users are going to start by just clicking on the link and seeing it on their
// laptop browser ... making the pivot or orbit off axis so that whenever you rotate your view in the browser you also
// move the camera position ... Add the off pivot motion, swaying, and the cursor directed motion"): on a screen the eye
// moves a little, so the 3D rover and terrain shift against what is behind them -
//   * it sits NECK_M in front of the point the view turns about (as the eyes are in front of the neck);
//   * it follows the pointer by up to HOVER_M, eased (a mouse, no button needed);
//   * (0.99.32-0.99.37: left alone for 3 s it circled slowly, 3 cm wide.)
// P turns it off and on; ?still=1 opens with it off.  Only where there is a 3D surface to see it on.
// 0.99.38 (Christian, 19 Nov 2026: "remove the swaying"): no sway.  0.99.39 (Christian: "the curser should move 5 cm"):
// the pointer moves the eye by up to 5 cm again (2 cm in 0.99.38)
const NECK_M = 0.15, HOVER_M = 0.05;
let motionOn = new URLSearchParams(location.search).get('still') !== '1';
const hover = new THREE.Vector2(), hoverNow = new THREE.Vector2(), eyeMove = new THREE.Vector3();
const eyeFwd = new THREE.Vector3(), eyeRight = new THREE.Vector3(), eyeUp = new THREE.Vector3();
let lastInput = performance.now();
const touched = () => { lastInput = performance.now(); };
for (const ev of ['pointerdown', 'wheel', 'keydown']) window.addEventListener(ev, touched, { passive: true });
window.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  hover.set(2 * e.clientX / window.innerWidth - 1, 1 - 2 * e.clientY / window.innerHeight);
  if (e.buttons || Math.abs(e.movementX) + Math.abs(e.movementY) > 2) touched();
}, { passive: true });
document.documentElement.addEventListener('mouseleave', () => hover.set(0, 0));
function screenEye3(dt) {                                        // -> eyeMove: the eye's place about the turning point (m)
  eyeMove.set(0, 0, 0);
  if (!motionOn || !roverParts.length) return eyeMove;
  camera.matrixWorld.extractBasis(eyeRight, eyeUp, eyeFwd);       // the camera's x, y and z (it looks along -z)
  const k = 1 - Math.exp(-dt / 0.25);
  hoverNow.lerp(hover, k);
  const sx = HOVER_M * hoverNow.x, sy = HOVER_M * hoverNow.y;
  return eyeMove.addScaledVector(eyeFwd, -NECK_M).addScaledVector(eyeRight, sx).addScaledVector(eyeUp, sy);
}
function look() {
  pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
  camera.rotation.set(pitch, -yaw, 0, 'YXZ');                    // yaw: azimuth, positive toward the east
}
const el = renderer.domElement;
el.style.touchAction = 'none';
el.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointerup', () => { drag = null; });
el.addEventListener('pointermove', e => {
  if (!drag || renderer.xr.isPresenting) return;
  const k = THREE.MathUtils.degToRad(camera.fov) / window.innerHeight;
  yaw -= (e.clientX - drag.x) * k; pitch += (e.clientY - drag.y) * k;
  drag = { x: e.clientX, y: e.clientY };
  look();
});
el.addEventListener('wheel', e => {
  camera.fov = Math.max(15, Math.min(100, camera.fov * (e.deltaY > 0 ? 1.1 : 0.9)));
  camera.updateProjectionMatrix();
}, { passive: true });
// 0.98.19 (Christian, 16 Nov 2026: "Make cross of N E S W with O in the middle to move the camera to that direction").
// 0.98.28 (Christian: "O should take you to the looking straight ahead of where the rover is (the +x direction in rover
// frame). This direction will be different every site"): O looks level along the rover's +x, the station's
// ground_mark.rover_forward_azimuth_deg.  Until 0.98.27 O took the nadir text's middle for the front - but the text has
// been turned 135 deg clockwise of the front since 0.98.7, so O looked 135 deg off; an entry published before 0.98.28
// has only the text's middle, and the front is that less TEXT_FROM_FORWARD_DEG.  Without a mark: the opening direction.
let roverFrontAz = null;
const TEXT_FROM_FORWARD_DEG = 135;
function roverForward(p) {
  for (const v of variants(p)) {
    const gm = v.ground_mark;
    if (!gm) continue;
    if (gm.rover_forward_azimuth_deg != null) return gm.rover_forward_azimuth_deg;
    if (gm.text_centre_azimuth_deg != null) return (gm.text_centre_azimuth_deg - TEXT_FROM_FORWARD_DEG + 360) % 360;
  }
  return null;
}
const FACE_AZ = { N: 0, E: 90, S: 180, W: 270 };
const O_PITCH_DEG = -30;     // 0.99.38 (Christian, 19 Nov 2026: "on the 2d viewer, the o button should point the view 30 below the horizon")
function face(k) {
  if (renderer.xr.isPresenting) return;
  const azDeg = k === 'O' ? (roverFrontAz != null ? roverFrontAz : startAz(panos[cur.s] || {})) : FACE_AZ[k];
  yaw = THREE.MathUtils.degToRad(azDeg) - world.rotation.y;
  pitch = k === 'O' ? THREE.MathUtils.degToRad(O_PITCH_DEG) : 0;    // 0.99.38: O looks down along the rover's +x
  look();
}
for (const k of 'NESWO') $('face' + k).onclick = () => face(k);
const LOOK_DEG_S = 90;
function lookByKeys(dt) {
  if (!lookKeys.size || renderer.xr.isPresenting) return;
  const r = THREE.MathUtils.degToRad(LOOK_DEG_S) * dt;
  yaw += r * ((lookKeys.has('d') ? 1 : 0) - (lookKeys.has('a') ? 1 : 0));
  pitch += r * ((lookKeys.has('w') ? 1 : 0) - (lookKeys.has('s') ? 1 : 0));
  look();
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------- headset: controller buttons
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  c.addEventListener('selectstart', e => step('s', e.data && e.data.handedness === 'left' ? -1 : 1));   // right trigger: next
  //                                                                                       station; left trigger: the one before
  // 0.99.40: right grip - the next terrain mode; left grip - the rover shown or hidden (grip: the next variant before)
  // 0.99.52 (Christian, 20 Nov 2026: "The grip button doesn't show and hide the rover like it used to"): either grip -
  // the right one was the terrain mode since 0.99.40, which B is
  c.addEventListener('squeezestart', () => roverToggle());
  scene.add(c);
}
const held = new Map();                         // per controller and button: pressed in the last frame
const TURN_DEG_S = 150, STICK_DEAD = 0.25;                     // 0.98.14: 150 deg / s at full stick (60 before: "should be faster")
function pressed(src, i) {                       // button i of this controller went down in this frame
  const b = src.gamepad.buttons[i], key = `${src.handedness}${i}`;
  const was = held.get(key) || false, is = !!(b && b.pressed);
  held.set(key, is);
  return is && !was;
}
let stickL = 0, stickR = 0, stickTurn = 0, yDown = 0, yDone = false;
function buttons(dt) {                           // xr-standard: button 4 is A (right) / X (left), button 5 is B (right) / Y (left)
  const session = renderer.xr.getSession();
  if (!session) return;
  for (const src of session.inputSources) {
    const gp = src.gamepad;
    if (!gp) continue;
    const left = src.handedness === 'left';
    if (pressed(src, 4)) { if (left) toggleInfo(); else step('w', 1); }       // 0.98.13: X (left): info; A (right): the next view
    // 0.99.52 (Christian, 20 Nov 2026: "want to escape the vr mode ... back to the 2d browser view" without the system's
    // quit dialog, which the Meta button always shows): Y held for a second ends the session; a short press is home
    if (left) {
      const down = !!(gp.buttons[5] && gp.buttons[5].pressed), now = performance.now();
      if (down && !yDown) { yDown = now; yDone = false; }
      if (down && !yDone && now - yDown > 1000) { yDone = true; session.end(); return; }
      if (!down && yDown) { if (!yDone) goHome(); yDown = 0; }
    } else if (pressed(src, 5)) stereoOrFull();
    if (false) { if (left) goHome(); else stereoOrFull(); }         // 0.98.28: Y (left): home, facing west; B (right): 0.99.41 stereo / full 3D
    // 0.99.40 (Christian, 19 Nov 2026: "In VR mode, enter driving/ steering mode with a click on the joystick. Left and
    // right still rotate the view and forward and back on the left and right controler works in like skid steering"):
    // a thumbstick click (xr-standard button 3) starts the drive where the station has it, and ends it
    if (pressed(src, 3) && (mode === 'drive' || variants(panos[cur.s] || {}).some(q => q.key === 'drive3d'))) driveToggle();
    if (DRIVE.on) {                                              // 0.99.33: a stick's forward / back axis is its side's track
      const y = -(gp.axes.length >= 4 ? gp.axes[3] : (gp.axes[1] || 0));
      const t = Math.abs(y) > STICK_DEAD ? Math.sign(y) * (Math.abs(y) - STICK_DEAD) / (1 - STICK_DEAD) : 0;
      if (left) stickL = t; else stickR = t;
    }
    const x = gp.axes.length >= 4 ? gp.axes[2] : (gp.axes[0] || 0);                          // thumbstick left / right
    // 1.0 (Christian, 20 Nov 2026: "the left and right joystick should turn the rover instead of turn the view"): in the
    // drive either stick's left / right turns the rover (one track against the other); the viewer rides along with it
    if (DRIVE.on) {
      if (Math.abs(x) > STICK_DEAD) stickTurn += Math.sign(x) * (Math.abs(x) - STICK_DEAD) / (1 - STICK_DEAD);
    } else if (Math.abs(x) > STICK_DEAD) {                                                   // right: the view turns to the right
      turn += THREE.MathUtils.degToRad(TURN_DEG_S) * dt * Math.sign(x) * (Math.abs(x) - STICK_DEAD) / (1 - STICK_DEAD);
      world.rotation.y = yaw0 + turn;
    }
  }
}

const headOffset = new THREE.Vector3(...((new URLSearchParams(location.search).get('head') || '0,0,0').split(',').map(Number).concat([0, 0, 0]).slice(0, 3).map(v => v || 0)));
const head = new THREE.Vector3(), gaze = new THREE.Vector3(), upv = new THREE.Vector3(), clock = new THREE.Clock();
function turnMarkText() {                                        // the ring's text upright for the viewer: its middle ahead of them
  if (!markDisc.visible) return;
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  cam.getWorldDirection(gaze);
  upv.set(0, 1, 0).applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()));
  gaze.add(upv);                                                 // looking straight down, "ahead" is where the head's top points
  if (Math.hypot(gaze.x, gaze.z) < 1e-3) return;
  const heading = Math.atan2(gaze.x, -gaze.z) + world.rotation.y;                 // east of the panorama's north
  let d = -(heading - markTextAz) - markOuter.rotation.z;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  markOuter.rotation.z += d * 0.15;                              // eased: it does not twitch with the head
}
// 0.99.26 (Christian, 18 Nov 2026: head motion "held within 1 m of the pivot"): in the station-mesh mode the textured
// surface comes along when the head goes farther than move_limit_m from where it was anchored, so the viewer stays in
// the space every surface was textured for
const offHead = new THREE.Vector3();
function holdNearPivot() {
  const vr = (variants(panos[cur.s] || {})[cur.v]) || {}, sm = vr.station_mesh;
  if (!sm || !anchored) return;
  const lim = sm.move_limit_m > 0 ? sm.move_limit_m : 1.0;
  offHead.subVectors(head, fixed.position);
  const L = offHead.length();
  if (L > lim) fixed.position.addScaledVector(offHead, (L - lim) / L);
}
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  lookByKeys(dt);
  turnMarkText();
  if (renderer.xr.isPresenting) {                                // the spheres stay centered on the head: an omnidirectional
    renderer.xr.getCamera().getWorldPosition(head);              // stereo pair has no parallax to give for head movement
    world.position.copy(head);
    if (!anchored) { fixed.position.copy(head); anchored = true; }   // the rover surface stays there: it has parallax
    if (DRIVE.on) {                                              // 0.99.33: the viewer may step away; the rover is shown
      const near = offHead.subVectors(head, fixed.position).length() <= 1.0;      // within 1 m of its pivot
      for (const m of roverParts) if (m.userData.kind === 'rover') m.visible = roverOn && near;
    } else holdNearPivot();
    if (meshFade) {                                              // 0.99.32: with the head off the anchor the panorama behind the
      const off = wholeScene ? 0 : offHead.subVectors(head, fixed.position).length();   // fourth mode's terrain no longer
      meshFade.set(Math.max(3, fadeBase.x - 5 * off), Math.max(4.5, fadeBase.y - 4 * off));   // fits its rim: the fade starts nearer
    }
    stickL = stickR = stickTurn = 0;
    buttons(dt);
    const tt = Math.max(-1, Math.min(1, stickTurn));             // right (> 0): the left track forward, the right one back
    driveStep(dt, Math.max(-1, Math.min(1, stickL + tt)), Math.max(-1, Math.min(1, stickR - tt)));
  } else {                                                       // on a screen: ?head=x,y,z (m: east, up, south) moves the eye off
    camera.updateMatrixWorld();
    camera.position.copy(headOffset).add(screenEye3(dt));        // the pivot (0.98.14) and the screen's eye movement (0.99.32)
    world.position.copy(camera.position); fixed.position.set(0, 0, 0);
    if (meshFade) meshFade.copy(fadeBase);
    if (DRIVE.on) {                                              // the arrow keys: up / down both tracks, left / right one against the other
      const f = (driveKeys.has('ArrowUp') ? 1 : 0) - (driveKeys.has('ArrowDown') ? 1 : 0), t = (driveKeys.has('ArrowLeft') ? 1 : 0) - (driveKeys.has('ArrowRight') ? 1 : 0);
      driveStep(dt, Math.max(-1, Math.min(1, f - 0.5 * t)), Math.max(-1, Math.min(1, f + 0.5 * t)));
    }
  }
  fixed.rotation.y = world.rotation.y;
  renderer.render(scene, camera);
});

// ---------------------------------------------------------------- what this device can show (0.97.4)
function diagnostics() {
  const gl = renderer.getContext();
  const ext = n => !!gl.getExtension(n);
  const d = { maxTexture: maxTex, maxCube: gl.getParameter(gl.MAX_CUBE_MAP_TEXTURE_SIZE), webgl2: renderer.capabilities.isWebGL2 !== false,
              astc: ext('WEBGL_compressed_texture_astc'), etc2: ext('WEBGL_compressed_texture_etc'),
              bc7: ext('EXT_texture_compression_bptc'), s3tc: ext('WEBGL_compressed_texture_s3tc'),
              anisotropy: renderer.capabilities.getMaxAnisotropy(), memoryGB: navigator.deviceMemory || null, xr: !!navigator.xr };
  const fmt = ['astc', 'etc2', 'bc7', 's3tc'].filter(k => d[k]).join(' ') || 'none';
  $('diag').textContent = `max texture ${d.maxTexture} | compressed: ${fmt}` + (d.memoryGB ? ` | memory >= ${d.memoryGB} GB` : '') +
    ` | 16K eye as one texture: ${d.maxTexture >= 16384 ? 'yes' : 'no'}`;
  console.log('RPP viewer diagnostics', JSON.stringify(d));
  window.rppDiagnostics = d;
  // 0.98.28: what the page shows, for checks (read only): station, variant, view, and the azimuth / elevation looked at on a screen
  window.rpvState = () => ({ id: (panos[cur.s] || {}).id, variant: ((variants(panos[cur.s] || {})[cur.v]) || {}).key, view: cur.w,
    mode, rover: roverShown(),
    lookAzDeg: (THREE.MathUtils.radToDeg(yaw + world.rotation.y) % 360 + 360) % 360, lookElDeg: THREE.MathUtils.radToDeg(pitch),
    roverFrontAz });
}
diagnostics();

// ---------------------------------------------------------------- start
(async () => {
  const index = new URL(new URLSearchParams(location.search).get('index') || 'panos.json', location.href);
  base = index.href;
  try {
    const j = await (await fetch(index, { cache: 'no-cache' })).json();
    panos = j.panos || j;
    traverse = j.traverse || null;
    if (traverse && traverse.ortho && traverse.ortho.file)       // the map's orbital picture: small, fetched once
      fetch(new URL(traverse.ortho.file, base).href).then(r => r.blob()).then(createImageBitmap)
        .then(b => { orthoImage = b; if (infoPanel.visible) drawInfo(); }).catch(e => console.warn('map picture', e));
    if (traverse && traverse.dtm && traverse.dtm.file)           // 0.98.19: the blank panel D (DTM, traverse, 2 km bar)
      fetch(new URL(traverse.dtm.file, base).href).then(r => r.blob()).then(createImageBitmap)
        .then(b => { dtmImage = b; if (infoPanel.visible) drawInfo(); }).catch(e => console.warn('DTM map', e));
    // 0.99.13: a list's own title, except the old "... stereo panoramas" of lists published before (0.99.15: and the
    // viewer's own names, old and new - the page's name wins)
    if (j.title && !/stereo panoramas|panorama viewer|photogrammetry viewer/i.test(j.title)) { $('title').textContent = j.title; document.title = j.title; }
  } catch (e) { msg(`no image list at ${index.href} (${e.message || e})`); return; }
  if (!panos.length) { msg('the image list is empty'); return; }
  fromHash();
  look();
  show();
})();
</script>
