name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[all]"
      - name: Static check
        run: python -m flake8 --select F src/rpp scripts
      - name: Unit and pipeline tests (two PDS products, no model downloads)
        env:
          RPP_CACHE: ${{ runner.temp }}/rpp_cache
          RPP_TEST_FETCH: "1"
        run: pytest -q -m "not slow" --deselect tests/test_mask_train.py
      - name: Slow tests (error-model physics)
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: pytest -q -m slow

  # What a user gets from PyPI: the wheel alone (no studies, no tests), installed into a clean environment.
  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the wheel and install it alone
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/w"
          if [ -x "$RUNNER_TEMP/w/bin/python" ]; then PY="$RUNNER_TEMP/w/bin/python"; else PY="$RUNNER_TEMP/w/Scripts/python.exe"; fi
          "$PY" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$PY" -m rpp --version
          "$PY" -m rpp --help
          "$PY" -m rpp sites list
          "$PY" -c "import rpp.viewer as v; assert (v.page_dir() / 'index.html').is_file() and (v.page_dir() / 'vendor' / 'three.module.min.js').is_file()"
          "$PY" -c "import importlib.util as u; assert u.find_spec('rpp_studies') is None, 'the studies are not for the wheel'"

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the paper (citations, figures)
        run: python -m rpp_studies.paper.build_paper --check-only || true
      - name: Build the JOSS draft
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
