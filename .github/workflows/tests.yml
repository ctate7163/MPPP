name: tests

on:
  push:
    branches: [main, v0p90]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[all]"
      - name: Static check
        run: python -m pyflakes src/mppp scripts
      - name: Unit and pipeline tests (two PDS products, no model downloads)
        env:
          MPPP_CACHE: ${{ runner.temp }}/mppp_cache
        run: pytest -q -m "not slow" --deselect tests/test_mask_train.py
      - name: Slow tests (error-model physics)
        if: github.event_name == 'push'
        run: pytest -q -m slow

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the paper (citations, figures)
        run: python scripts/build_paper.py --check-only || true
      - name: Build the JOSS draft
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
