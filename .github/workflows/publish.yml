# Publish MPPP to PyPI (https://pypi.org/project/mppp/) when a GitHub release is published (0.94.4).
# Trusted publishing (OpenID Connect): no API token is stored anywhere. One-time setup on pypi.org - a "pending
# publisher" for the project name mppp, owner ctate7163, repository MPPP, workflow publish.yml, environment pypi
# (docs/RELEASING.md, section 8). "Run workflow" by hand publishes to TestPyPI instead, as a rehearsal.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The version is the release tag
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'src'); import mppp; print(mppp.__version__)")
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "tag ${{ github.event.release.tag_name }} but __version__ $v"; exit 1; }
      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          /tmp/w/bin/mppp --version
          /tmp/w/bin/mppp doctor || true          # reports what is missing (no torch / pycolmap here)
          /tmp/w/bin/python -c "import mppp.paths as p; assert (p.data_dir() / 'sites.json').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mppp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mppp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
