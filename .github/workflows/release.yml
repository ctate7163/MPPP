# Publish RPP to PyPI (https://pypi.org/project/rover-photogrammetry/) when a version tag v* is pushed (0.99.46; a
# published GitHub release from 0.94.4, publish.yml). Trusted publishing (OpenID Connect): no API token is stored
# anywhere. One-time setup on pypi.org - a "pending publisher" for the project rover-photogrammetry, owner ctate7163,
# the repository, workflow release.yml, environment pypi (docs/RELEASING.md, section 8). "Run workflow" by hand
# publishes to TestPyPI instead, as a rehearsal.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The version is the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'src'); import rpp; print(rpp.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but __version__ $v"; exit 1; }
      - name: The wheel holds no checkpoints, PDS products or run folders
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = [n for w in glob.glob("dist/*.whl") for n in zipfile.ZipFile(w).namelist()]
          bad = [n for n in names if n.lower().endswith((".pt", ".safetensors", ".img", ".vic"))
                 or "/runs/" in n or "/checkpoints/" in n or "Claude outputs" in n]
          print(len(names), "files in the wheel")
          sys.exit("not for the wheel: " + ", ".join(bad[:20]) if bad else 0)
          PY
      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          /tmp/w/bin/rpp --version
          /tmp/w/bin/rpp doctor || true          # reports what is missing (no torch / pycolmap here)
          /tmp/w/bin/python -c "import rpp.paths as p; assert (p.data_dir() / 'sites.json').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rover-photogrammetry/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/rover-photogrammetry/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
