[build-system]
requires = ["setuptools>=77.0.3"]          # 77: the SPDX license expression and license-files (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "rover-photogrammetry-pipeline"   # 0.99.0: the import name is rpp (formerly mppp); "rpp" on PyPI is another project
dynamic = ["version"]      # from rpp.__version__ (the single source)
description = "Rover Photogrammetry Pipeline (RPP, formerly MPPP): Mars rover PDS images to COLMAP and Metashape, with rover masks, camera models and pose priors"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Christian Tate", email = "ctate7163@gmail.com" }]
maintainers = [{ name = "Christian Tate", email = "ctate7163@gmail.com" }]
keywords = ["Mars 2020", "Perseverance", "photogrammetry", "structure from motion", "COLMAP", "Metashape",
            "Navcam", "Mastcam-Z", "Hazcam", "PDS", "camera calibration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy", "scipy", "opencv-python-headless", "pdr>=1.4", "pvl",
  "colour-demosaicing", "tifffile", "piexif",
]

[project.optional-dependencies]
mask    = ["torch", "timm", "safetensors"]                                   # mask inference (the model comes from Hugging Face)
sfm     = ["pycolmap>=4.2,<4.3", "pyceres>=2.6,<2.7", "torch", "kornia>=0.7"]   # COLMAP pipeline; kornia: SIFT + LightGlue matching
error   = ["matplotlib", "pillow"]                                            # the error model (under development)
plots   = ["matplotlib", "pillow"]                                            # health and camera plots
maps    = ["matplotlib", "scipy", "pillow", "adjustText", "rasterio", "pyproj"]   # the M20 site-map figures (make_maps.bat)
notebooks = ["jupyterlab", "matplotlib", "pillow"]
rover   = ["spiceypy>=6"]                                                     # the rover kernels (studies/rover_frame)
release = ["huggingface_hub"]                                                 # rpp_studies.mask_training.release_mask_model
ibr     = ["open3d>=0.20", "huggingface_hub"]                                  # 0.96: rpp mesh / depthmaps / ods (rpp.ibr); 0.99.3: the upload
docs    = ["mkdocs>=1.6.1,<2", "mkdocs-material>=9.7", "mkdocstrings[python]>=1.0"]     # the documentation site (mkdocs.yml)
dev     = ["pytest", "flake8", "nbformat", "pillow"]
all     = ["rover-photogrammetry-pipeline[mask,sfm,error,plots,maps,notebooks,rover,ibr,dev]"]

[tool.setuptools.dynamic]
version = { attr = "rpp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["rpp*", "mppp*"]     # mppp, mppp_studies: the names before 0.99 (alias packages)

[tool.setuptools.package-data]
rpp = ["data/*.json", "data/*.csv", "data/*.txt", "data/cmods/*.json", "data/cmods/*.md", "data/rover/*.npz", "data/rover/*.md"]
rpp_studies = ["validation/*.json", "calibration/data/*.json"]

[project.scripts]
rpp = "rpp.cli:main"
mppp = "mppp:cli_main"          # 0.99 only: the command before the rename, with a note

[project.urls]
Homepage = "https://github.com/ctate7163/rpp"
Documentation = "https://ctate7163.github.io/rpp/"
Repository = "https://github.com/ctate7163/rpp"
Issues = "https://github.com/ctate7163/rpp/issues"
Changelog = "https://github.com/ctate7163/rpp/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: tests that take more than a few seconds (error-model physics, mask training)"]
tmp_path_retention_policy = "failed"     # a full run left ~5.5 GB of temporary folders
