[build-system]
requires = ["setuptools>=77.0.3"]          # 77: the SPDX license expression and license-files (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "mppp"
dynamic = ["version"]      # from mppp.__version__ (the single source)
description = "Mars Photogrammetry Preprocessing Pipeline: Mars 2020 PDS images to COLMAP and Metashape, with rover masks, camera models and pose priors"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Christian Tate", email = "ctate7163@gmail.com" }]
maintainers = [{ name = "Christian Tate", email = "ctate7163@gmail.com" }]
keywords = ["Mars 2020", "Perseverance", "photogrammetry", "structure from motion", "COLMAP", "Metashape",
            "Navcam", "Mastcam-Z", "Hazcam", "PDS", "camera calibration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy", "scipy", "opencv-python-headless", "pdr>=1.4", "pvl",
  "colour-demosaicing", "tifffile", "piexif",
]

[project.optional-dependencies]
mask    = ["torch", "timm", "safetensors"]                                   # mask inference (the model comes from Hugging Face)
sfm     = ["pycolmap>=4.2,<4.3", "pyceres>=2.6,<2.7", "torch", "kornia>=0.7"]   # COLMAP pipeline; kornia: SIFT + LightGlue matching
error   = ["matplotlib", "pillow"]                                            # the error model (under development)
plots   = ["matplotlib", "pillow"]                                            # health and camera plots
maps    = ["matplotlib", "scipy", "pillow", "adjustText", "rasterio", "pyproj"]   # the M20 site-map figures (make_maps.bat)
notebooks = ["jupyterlab", "matplotlib", "pillow"]
release = ["huggingface_hub"]                                                 # scripts/release_mask_model.py
docs    = ["mkdocs>=1.6.1,<2", "mkdocs-material>=9.7", "mkdocstrings[python]>=1.0"]     # the documentation site (mkdocs.yml)
dev     = ["pytest", "flake8", "nbformat", "pillow"]
all     = ["mppp[mask,sfm,error,plots,maps,notebooks,dev]"]

[tool.setuptools.dynamic]
version = { attr = "mppp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mppp*"]

[tool.setuptools.package-data]
mppp = ["data/*.json", "data/*.csv", "data/*.txt", "data/cmods/*.json", "data/cmods/*.md"]

[project.scripts]
mppp = "mppp.cli:main"

[project.urls]
Homepage = "https://github.com/ctate7163/MPPP"
Documentation = "https://ctate7163.github.io/MPPP/"
Repository = "https://github.com/ctate7163/MPPP"
Issues = "https://github.com/ctate7163/MPPP/issues"
Changelog = "https://github.com/ctate7163/MPPP/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: tests that take more than a few seconds (error-model physics, mask training)"]
tmp_path_retention_policy = "failed"     # a full run left ~5.5 GB of temporary folders
